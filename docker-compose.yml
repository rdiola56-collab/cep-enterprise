# Local stack: PostgreSQL, Redis (reserved for Celery background jobs in a later phase), API, web.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cep
      POSTGRES_PASSWORD: cep
      POSTGRES_DB: cep
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cep"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      CEP_DATABASE_URL: postgresql+psycopg://cep:cep@db:5432/cep
      CEP_SECRET_KEY: ${CEP_SECRET_KEY:?set CEP_SECRET_KEY to a long random value}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
  frontend:
    build:
      context: ./frontend
      args: { CEP_API_URL: "http://backend:8000" }
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
