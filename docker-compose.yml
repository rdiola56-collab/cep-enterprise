# Local stack: PostgreSQL, Redis (job queue), API, background worker, web.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: cep
      POSTGRES_PASSWORD: cep
      POSTGRES_DB: cep
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cep"]
      interval: 5s
      retries: 10
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    environment:
      CEP_DATABASE_URL: postgresql+psycopg://cep:cep@db:5432/cep
      CEP_SECRET_KEY: ${CEP_SECRET_KEY:?set CEP_SECRET_KEY to a long random value}
      CEP_REDIS_URL: redis://redis:6379/0
      # Single sign-on (optional): set all three to switch it on. See docs/ARCHITECTURE.md.
      CEP_OIDC_ISSUER: ${CEP_OIDC_ISSUER:-}
      CEP_OIDC_CLIENT_ID: ${CEP_OIDC_CLIENT_ID:-}
      CEP_OIDC_CLIENT_SECRET: ${CEP_OIDC_CLIENT_SECRET:-}
      CEP_OIDC_REDIRECT_URI: ${CEP_OIDC_REDIRECT_URI:-}
      # Revit import (optional): an Autodesk Platform Services app. See docs/ARCHITECTURE.md.
      CEP_APS_CLIENT_ID: ${CEP_APS_CLIENT_ID:-}
      CEP_APS_CLIENT_SECRET: ${CEP_APS_CLIENT_SECRET:-}
      CEP_APS_REGION: ${CEP_APS_REGION:-US}
      # Outgoing email (optional): set host, sender and app URL to switch it on.
      CEP_SMTP_HOST: ${CEP_SMTP_HOST:-}
      CEP_SMTP_PORT: ${CEP_SMTP_PORT:-587}
      CEP_SMTP_SECURITY: ${CEP_SMTP_SECURITY:-starttls}
      CEP_SMTP_USER: ${CEP_SMTP_USER:-}
      CEP_SMTP_PASSWORD: ${CEP_SMTP_PASSWORD:-}
      CEP_MAIL_FROM: ${CEP_MAIL_FROM:-}
      CEP_APP_URL: ${CEP_APP_URL:-}
      # SAML single sign-on (optional): IdP metadata and this site's public base URL.
      CEP_SAML_IDP_METADATA_URL: ${CEP_SAML_IDP_METADATA_URL:-}
      CEP_SAML_SP_BASE_URL: ${CEP_SAML_SP_BASE_URL:-}
      CEP_SAML_LABEL: ${CEP_SAML_LABEL:-Sign in with SAML}
      CEP_SAML_EMAIL_ATTRIBUTE: ${CEP_SAML_EMAIL_ATTRIBUTE:-}
      CEP_SAML_AUTO_CREATE: ${CEP_SAML_AUTO_CREATE:-}
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  worker:
    build: ./backend
    command: celery -A app.jobs worker --loglevel=info --concurrency=2
    environment:
      CEP_DATABASE_URL: postgresql+psycopg://cep:cep@db:5432/cep
      CEP_SECRET_KEY: ${CEP_SECRET_KEY:?set CEP_SECRET_KEY to a long random value}
      CEP_REDIS_URL: redis://redis:6379/0
      # Revit import (optional): an Autodesk Platform Services app. See docs/ARCHITECTURE.md.
      CEP_APS_CLIENT_ID: ${CEP_APS_CLIENT_ID:-}
      CEP_APS_CLIENT_SECRET: ${CEP_APS_CLIENT_SECRET:-}
      CEP_APS_REGION: ${CEP_APS_REGION:-US}
      # Outgoing email (optional): set host, sender and app URL to switch it on.
      CEP_SMTP_HOST: ${CEP_SMTP_HOST:-}
      CEP_SMTP_PORT: ${CEP_SMTP_PORT:-587}
      CEP_SMTP_SECURITY: ${CEP_SMTP_SECURITY:-starttls}
      CEP_SMTP_USER: ${CEP_SMTP_USER:-}
      CEP_SMTP_PASSWORD: ${CEP_SMTP_PASSWORD:-}
      CEP_MAIL_FROM: ${CEP_MAIL_FROM:-}
      CEP_APP_URL: ${CEP_APP_URL:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
  frontend:
    build:
      context: ./frontend
      args: { CEP_API_URL: "http://backend:8000" }
    ports: ["3000:3000"]
    depends_on: [backend]
volumes:
  pgdata:
