[project]
name = "cep-enterprise-backend"
version = "0.1.0"
description = "CEP: ENTERPRISE — Universal Estimating Engine and API"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0.36,<3",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "openpyxl>=3.1,<4",
  "reportlab>=4.2",
  "python-multipart>=0.0.9",
  "ezdxf>=1.3,<2",
  "ifcopenshell>=0.8",
  "celery[redis]>=5.4,<6",
  "httpx>=0.27",
  "pyjwt[crypto]>=2.9,<3",
  "pdfplumber>=0.11.4,<0.12",
  "pypdfium2>=4.30",
  "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "pypdf>=4"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 130
